; PlatformIO Project Configuration File
; ESP32-S3 firmware (UI, AirPlay, USB) plus a native LVGL emulator of the UI,
; since that part is pure LVGL and needs no hardware.
; Build/flash: `pio run -e s3 -t upload`
; Run the UI on desktop: `pio run -e native -t exec`
;
; The espidf env pins pioarduino's platform (ESP-IDF 5.5.5): it is the
; first release that works with PlatformIO Core 6.2's SCons 4.11.

[env:s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1 ; flash/PSRAM come from sdkconfig.defaults.s3, not this board's defaults
framework = espidf
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.s3
board_build.partitions = partitions_s3.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../lib
lib_deps = lvgl/lvgl@^9.6.0
build_flags = -DLV_CONF_INCLUDE_SIMPLE

[env:native]
platform = native
lib_extra_dirs = ../lib
build_src_filter = +<ui/> +<main_native.c>
lib_deps = lvgl/lvgl@^9.6.0
lib_ignore = pair_ap ; needs ESP-IDF mbedtls
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DAK_NATIVE
    -Iinclude
    -Isrc/ui
    -Isrc/ui/assets
    -I/opt/homebrew/include
    -I/opt/homebrew/include/SDL2
    -D_THREAD_SAFE
    -L/opt/homebrew/lib
    -lSDL2main
    -lSDL2
    -Wl,-framework,Cocoa
