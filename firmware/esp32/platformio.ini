; ESP32-U4WDH firmware: Classic Bluetooth (A2DP sink, AVRCP). Never brings WiFi up.
; Build/flash: `pio run -e esp32 -t upload`
;
; Pins pioarduino's platform (ESP-IDF 5.5.5): it is the first release that
; works with PlatformIO Core 6.2's SCons 4.11.

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev ; flash layout comes from sdkconfig.defaults.esp32 (U4WDH: 4MB embedded, no PSRAM)
framework = espidf
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32
board_build.partitions = partitions_esp32.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../lib
