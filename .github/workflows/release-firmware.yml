name: Release firmware

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (a draft release is also supported)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-firmware-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  firmware:
    name: Build and attach OTA firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_DIR: release-artifacts
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check release tooling
        run: python -m unittest discover -s tests/ota -p test_release_ci.py

      - name: Prepare independently versioned firmware
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/release_firmware.py prepare

      - name: Check the release accepts assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          immutable="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.immutable // false')"
          if [[ "$immutable" == "true" ]]; then
            echo '::error::This release is immutable. Run this workflow against a draft release before publishing it.'
            exit 1
          fi

      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.2.0'

      - name: Build main firmware
        run: pio run -d firmware/s3 -e s3

      - name: Build Bluetooth firmware
        if: steps.release.outputs.bluetooth_changed == 'true'
        run: pio run -d firmware/esp32 -e esp32

      - name: Check partition limits
        run: python tests/partitions/check.py

      - name: Package and verify OTA images
        env:
          BLUETOOTH_CHANGED: ${{ steps.release.outputs.bluetooth_changed }}
          BLUETOOTH_VERSION: ${{ steps.release.outputs.bluetooth_version }}
        run: python tools/release_firmware.py package

      - name: Attach both images to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BLUETOOTH_VERSION: ${{ steps.release.outputs.bluetooth_version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RELEASE_DIR/firmware-s3.bin#version:$RELEASE_TAG" \
            "$RELEASE_DIR/firmware-esp32.bin#version:$BLUETOOTH_VERSION" \
            "$RELEASE_DIR/SHA256SUMS" \
            --clobber
