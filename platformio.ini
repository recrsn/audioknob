; PlatformIO Project Configuration File
; Dual-MCU project (ESP32-S3 UI/USB/AirPlay + ESP32 Bluetooth) plus a native LVGL
; emulator for the S3's UI, since that part is pure LVGL and needs no hardware.
; Build/flash: `pio run -e s3 -t upload` / `pio run -e esp32 -t upload`
; Run the UI on desktop: `pio run -e native -t exec`
;
; Both espidf envs pin pioarduino's platform (ESP-IDF 5.5.5): it is the
; first release that works with PlatformIO Core 6.2's SCons 4.11.

[env:s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1 ; flash/PSRAM come from sdkconfig.defaults.s3, not this board's defaults
framework = espidf
board_build.cmake_extra_args = -DAK_TARGET=s3 -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.s3
board_build.partitions = partitions_s3.csv
board_upload.flash_size = 16MB
lib_deps = lvgl/lvgl@^9.2.0
build_flags = -DLV_CONF_INCLUDE_SIMPLE

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev ; flash layout comes from sdkconfig.defaults.esp32 (U4WDH: 4MB embedded, no PSRAM)
framework = espidf
board_build.cmake_extra_args = -DAK_TARGET=esp32 -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32
board_build.partitions = partitions_esp32.csv
board_upload.flash_size = 4MB

[env:native]
platform = native
build_src_filter = +<s3/ui.c> +<s3/ui_tools.c> +<s3/icons.c> +<s3/font_*.c> +<s3/main_native.c>
lib_deps = lvgl/lvgl@^9.2.0
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DAK_NATIVE
    -Iinclude
    -I/opt/homebrew/include
    -I/opt/homebrew/include/SDL2
    -D_THREAD_SAFE
    -L/opt/homebrew/lib
    -lSDL2main
    -lSDL2
    -Wl,-framework,Cocoa
